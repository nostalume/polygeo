[project]
name = "polygeo"
version = "0.1.0"
description = "A reading implementation of discrete differential geometry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "nostalume", email = "nostalume@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.2",
    "scipy>=1.16.1",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.12,<5"]
plot = ["plotly>=6"]

[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/polygeo-py/Cargo.toml"
module-name = "polygeo._polygeo_native"
python-source = "src"

[tool.marimo.runtime]
pythonpath = ["."]

[dependency-groups]
dev = [
    "marimo==0.23.15",
    "plotly>=6",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]

[tool.pytest.ini_options]
markers = ["slow: release-only notebook export smoke tests"]
addopts = "-m 'not slow'"
filterwarnings = ["error"]

[tool.ty.src]
exclude = ["tests/typing/*_invalid.py"]
