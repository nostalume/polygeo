[project]
name = "polygeo"
version = "0.1.0"
description = "A reading implementation of discrete differential geometry"
readme = "README.md"
authors = [
    { name = "nostalume", email = "nostalume@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.2",
    "scipy>=1.16.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo==0.23.15",
    "plotly>=6",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]

[tool.pytest.ini_options]
markers = ["slow: release-only notebook export smoke tests"]
addopts = "-m 'not slow'"
