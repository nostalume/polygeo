name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-examples:
    name: Quality and examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets --all-features
      - run: uv run pytest tests -q
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check --error-on-warning .
      - run: cargo fmt --all --manifest-path rust/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build strict Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path rust/Cargo.toml --workspace --no-deps
      - run: uv run marimo check --strict examples/surface/*.py examples/pde/*.py examples/topology/*.py examples/fields/*.py
      - run: uv run pytest tests -m slow -q
      - run: git diff --exit-code

  platform-tests:
    name: Platform tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets --all-features
      - run: uv run pytest tests -q

  distribution-smoke:
    name: Distribution smoke
    needs: [quality-and-examples, platform-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          sync: "false"
      - name: Select temporary artifact directory
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/polygeo-artifacts" >> "$GITHUB_ENV"
      - name: Build wheel and source distribution once
        run: uv build --out-dir "$ARTIFACT_DIR"
      - name: Inspect artifact contents
        shell: bash
        run: |
          shopt -s nullglob
          wheels=("$ARTIFACT_DIR"/*.whl)
          sdists=("$ARTIFACT_DIR"/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          unzip -Z1 "${wheels[0]}" | tee "${RUNNER_TEMP}/wheel-contents.txt"
          tar -tzf "${sdists[0]}" | tee "${RUNNER_TEMP}/sdist-contents.txt"
          grep -Eq 'polygeo/_polygeo_native.*\.(so|pyd)$' "${RUNNER_TEMP}/wheel-contents.txt"
          grep -q 'rust/polygeo-py/src/array.rs' "${RUNNER_TEMP}/sdist-contents.txt"
          for module in topology chain form geometry solve field plot mesh; do
            grep -q "polygeo/${module}.py" "${RUNNER_TEMP}/wheel-contents.txt"
            grep -q "src/polygeo/${module}.py" "${RUNNER_TEMP}/sdist-contents.txt"
          done
          for retired in registration shared; do
            ! grep -q "rust/polygeo-py/src/${retired}.rs" "${RUNNER_TEMP}/sdist-contents.txt"
          done
          for retired in algorithms operators solvers surface systems plotting; do
            ! grep -q "polygeo/${retired}.py" "${RUNNER_TEMP}/wheel-contents.txt"
            ! grep -q "src/polygeo/${retired}.py" "${RUNNER_TEMP}/sdist-contents.txt"
          done
      - name: Verify wheel and source distribution
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=("$ARTIFACT_DIR"/*.whl "$ARTIFACT_DIR"/*.tar.gz)
          for artifact in "${artifacts[@]}"; do
            environment="${RUNNER_TEMP}/polygeo-$(basename "$artifact")"
            uv venv "$environment" --python 3.14
            uv pip install --python "$environment" "$artifact"
            "$environment/bin/python" -I tests/installed_artifact.py base
            uv pip install --python "$environment" "${artifact}[mesh,plot]"
            "$environment/bin/python" -I tests/installed_artifact.py extras
          done
