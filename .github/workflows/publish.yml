name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          sync: "false"
      - id: python
        shell: bash
        run: echo "path=$(uv python find 3.14)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist -i ${{ steps.python.outputs.path }}
          rust-toolchain: 1.97.1
      - if: matrix.os == 'ubuntu-latest'
        run: uv build --sdist --out-dir dist
      - name: Smoke-test built distributions
        shell: bash
        run: |
          shopt -s nullglob
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --python 3.14 --with "$artifact" python -I tests/installed_artifact.py base
            uv run --isolated --no-project --python 3.14 --with "${artifact}[mesh,plot]" python -I tests/installed_artifact.py extras
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  distributions:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          sync: "false"
      - name: Verify package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python_version=$(uv version --short)
          core_version=$(cargo pkgid --manifest-path rust/Cargo.toml polygeo-core)
          adapter_version=$(cargo pkgid --manifest-path rust/Cargo.toml polygeo-py)
          core_version=${core_version##*#}
          adapter_version=${adapter_version##*#}
          test "$python_version" = "$core_version"
          test "$python_version" = "$adapter_version"
          if test -n "$RELEASE_TAG"; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$RELEASE_TAG" = "v$python_version"
          fi
      - name: Dry-run the Rust package
        run: cargo publish --dry-run --locked --registry crates-io --manifest-path rust/polygeo-core/Cargo.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify the publication set
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*)
          sdists=(dist/*.tar.gz)
          linux=(dist/*manylinux_2_28_x86_64.whl)
          windows=(dist/*win_amd64.whl)
          test "${#artifacts[@]}" -eq 3
          test "${#sdists[@]}" -eq 1
          test "${#linux[@]}" -eq 1
          test "${#windows[@]}" -eq 1
          uv tool run --from twine==7.0.0 twine check dist/*
          sha256sum dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-core:
    if: github.event_name == 'push'
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked --registry crates-io --manifest-path rust/polygeo-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    if: github.event_name == 'push'
    needs: [distributions, publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/polygeo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
