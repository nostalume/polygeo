name: Setup project
description: Install pinned toolchains and optionally synchronize the project
inputs:
  sync:
    description: Synchronize the locked development environment
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: 1.97.1
        components: rustfmt,clippy
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked --all-groups --extra mesh --extra plot
